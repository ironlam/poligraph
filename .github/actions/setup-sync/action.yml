name: Setup sync job
description: Node, dependencies and Prisma client for a sync job. Run after actions/checkout.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Generate Prisma Client
      shell: bash
      run: npx prisma generate
