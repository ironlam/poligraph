name: Sync Wikidata Affairs

on:
  schedule:
    # Run every Sunday at 2:00 AM UTC (~3h Paris winter / ~4h summer)
    - cron: "0 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  sync-wikidata-affairs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Each step runs independently; the aggregate step at the end re-fails the
      # job if either failed so the notify job can fire.
      - name: Discover affairs (Wikidata + Wikipedia AI)
        id: discover-affairs
        run: npm run discover:affairs -- --wikidata-only --limit=50
        continue-on-error: true

      - name: Reconcile duplicate affairs
        id: reconcile-affairs
        run: npm run reconcile:affairs -- --auto-merge
        continue-on-error: true

      # Filet de sécurité : on contrôle l'état réel de la base après import
      # plutôt que de se fier au seul code. Une affaire publique sans
      # validation humaine tracée fait échouer le job et ouvre une issue.
      - name: Assert no affair published without human validation
        id: audit-compliance
        run: npm run audit:compliance -- --fail-on-leak
        continue-on-error: true

      - name: Fail job if any step failed
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.discover-affairs.outcome }}" = "failure" ] && FAILED="$FAILED discover-affairs"
          [ "${{ steps.reconcile-affairs.outcome }}" = "failure" ] && FAILED="$FAILED reconcile-affairs"
          [ "${{ steps.audit-compliance.outcome }}" = "failure" ] && FAILED="$FAILED audit-compliance"
          if [ -n "$FAILED" ]; then
            echo "::error::Failed steps:$FAILED"
            echo "FAILED_STEPS=$FAILED" >> $GITHUB_ENV
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Sync Wikidata Affairs Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed steps**: ${FAILED_STEPS:-none}" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [sync-wikidata-affairs]
    if: failure() && !cancelled()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-wikidata-affairs-failure";
            const title = `Sync Wikidata Affairs failed - ${new Date().toISOString().split("T")[0]}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## Sync Wikidata Affairs failed",
              "",
              `**Workflow run**: ${runUrl}`,
              `**Triggered by**: ${context.actor}`,
              `**Commit**: \`${context.sha.slice(0, 7)}\``,
              "",
              "### Checklist",
              "- [ ] Open the workflow run and identify which step failed",
              "- [ ] Check `docs/RUNBOOK.md` for triage steps",
              "- [ ] Re-run the workflow once the underlying cause is fixed",
              "- [ ] Close this issue when resolved",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, "automated"],
              });
            }
