name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Cancel the superseded run when a new commit lands on the same pull request: the build
# job makes an obsolete run expensive rather than merely noisy. Only for pull requests,
# so every run on main and staging is kept: a cancelled run there would leave a commit
# unverified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript typecheck
        run: npm run typecheck

  format-check:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run tests
        run: npm run test:run

  sec-02-role-contract:
    name: SEC-02 role contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify public and server database roles
        run: npm run test:security:data-path

  sec-03-least-privilege-contract:
    name: SEC-03 least-privilege contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify application database privileges
        run: npm run test:security:least-privilege

  sec-06-function-privilege-contract:
    name: SEC-06 function privilege contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify application function privileges
        run: npm run test:security:function-privileges

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # An EMPTY PostgreSQL 17, and no .env: the point of this job is to prove the build
    # holds without secrets and without production data. Every earlier build ran locally,
    # where `next build` silently loads .env by itself, so "it builds here" never tested
    # what this job tests.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: poligraph_test
          POSTGRES_PASSWORD: poligraph_test
          POSTGRES_DB: poligraph_test
        ports:
          - 5432:5432
        # -h localhost forces TCP: the entrypoint runs a temporary server on the Unix
        # socket while executing its init scripts, and a socket probe reports healthy
        # against that one.
        options: >-
          --health-cmd "pg_isready -h localhost -U poligraph_test -d poligraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://poligraph_test:poligraph_test@localhost:5432/poligraph_test
      DIRECT_URL: postgresql://poligraph_test:poligraph_test@localhost:5432/poligraph_test
      DATABASE_SSL: "false"
      NEXT_TELEMETRY_DISABLED: "1"
      CHECKPOINT_DISABLE: "1"
      BUILD_NET_LOG: ${{ github.workspace }}/build-network.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # The same file the local harness feeds its container, so the two cannot drift:
      # unaccent, which the search queries call, and the ten publicId sequences, which
      # are not in the datamodel and which `db push` therefore cannot create.
      - name: Create extensions and publicId sequences
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/init-search.sql

      # No --accept-data-loss: the database is empty, so there is nothing to lose, and
      # a push that WOULD need the flag is a signal rather than something to force.
      - name: Apply the schema
        run: npx prisma db push

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --require ${{ github.workspace }}/scripts/build-net-probe.cjs

      # Runs even when the build fails: a build that died halfway may still have reached
      # somewhere new, and that is worth seeing.
      - name: Check the hosts the build reached
        if: always()
        run: npm run build:net-check

  header-responsive:
    name: Header responsive
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The header is global, and #688 showed a 100px overflow at exactly 1024px surviving a
    # full green pipeline: nothing here ran a browser. This job is the narrowest thing that
    # makes that class of defect fail a check rather than reach production.
    #
    # Deliberately not the whole visual suite. The other specs need their own seeded
    # fixtures; this one was written to hold on `/` with an empty database plus three flags.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: poligraph_test
          POSTGRES_PASSWORD: poligraph_test
          POSTGRES_DB: poligraph_test
        ports:
          - 5432:5432
        # -h localhost forces TCP: the entrypoint runs a temporary server on the Unix
        # socket while executing its init scripts, and a socket probe reports healthy
        # against that one.
        options: >-
          --health-cmd "pg_isready -h localhost -U poligraph_test -d poligraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://poligraph_test:poligraph_test@localhost:5432/poligraph_test
      DIRECT_URL: postgresql://poligraph_test:poligraph_test@localhost:5432/poligraph_test
      DATABASE_SSL: "false"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Explicit, unlike the build job above: that one runs `npm run build`, which is
      # `prisma generate && next build`. This job serves the app with `next dev`, which
      # generates nothing, so without this step every import of `@/generated/prisma`
      # fails to resolve and the dev server never comes up.
      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Create extensions and publicId sequences
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/init-search.sql

      - name: Apply the schema
        run: npx prisma db push

      # The header renders two of its five primary links behind flags, and the Boussole
      # behind a third. Enabling them is what makes this run measure the widest header
      # instead of whatever a bare database happens to produce.
      - name: Enable the flags that widen the header
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f tests/visual/fixtures/header-flags.sql

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Playwright starts `npm run dev` itself (see playwright.config.ts). Only `/` is
      # visited, so only that route compiles.
      - name: Run the header guard
        run: npx playwright test tests/visual/header-responsive.spec.ts --project=chromium

      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: header-responsive-report
          path: |
            tests/visual/playwright-report
            tests/visual/test-results
          retention-days: 7
