name: Sync Politicians

on:
  schedule:
    # Run every Sunday at 3:00 AM UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  sync-politicians:
    runs-on: ubuntu-latest
    # The full refresh can legitimately exceed an hour when official sources
    # throttle requests. Keep a generous job bound while retaining per-step
    # limits so a permanently hung source still unblocks the remaining syncs.
    timeout-minutes: 90
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Each sub-sync runs independently (continue-on-error) so that one failure
      # does not block the others. The "Fail job if any sub-sync failed" step
      # at the end re-fails the job so the notify job can fire.
      - name: Sync Assemblée Nationale (Deputies)
        id: sync-assemblee
        run: npm run sync:assemblee
        timeout-minutes: 20
        continue-on-error: true

      - name: Sync Sénat (Senators)
        id: sync-senat
        run: npm run sync:senat
        timeout-minutes: 15
        continue-on-error: true

      - name: Sync Gouvernement (Ministers)
        id: sync-gouvernement
        run: npm run sync:gouvernement
        timeout-minutes: 5
        continue-on-error: true

      # Bounded per-run: process the least-recently-checked slice, then stamp a
      # rotation cursor so successive weekly runs cover everyone (see the
      # careerCheckedAt / photoCheckedAt columns). Full scans blew the timeout.
      - name: Sync Careers (Wikidata P39/P488/P112)
        id: sync-careers
        run: npm run sync:careers -- --limit=3000
        timeout-minutes: 15
        continue-on-error: true

      - name: Sync Photos
        id: sync-photos
        run: npm run sync:photos -- --limit=2000
        timeout-minutes: 15
        continue-on-error: true

      - name: Sync Deceased (from Wikidata)
        id: sync-deceased
        run: npm run sync:deceased
        timeout-minutes: 10
        continue-on-error: true

      - name: Show sync stats
        if: always()
        run: npm run sync:stats
        continue-on-error: true

      - name: Fail job if any sub-sync failed
        if: always()
        run: |
          FAILED=""
          [ "${{ steps.sync-assemblee.outcome }}" = "failure" ] && FAILED="$FAILED assemblee"
          [ "${{ steps.sync-senat.outcome }}" = "failure" ] && FAILED="$FAILED senat"
          [ "${{ steps.sync-gouvernement.outcome }}" = "failure" ] && FAILED="$FAILED gouvernement"
          [ "${{ steps.sync-careers.outcome }}" = "failure" ] && FAILED="$FAILED careers"
          [ "${{ steps.sync-photos.outcome }}" = "failure" ] && FAILED="$FAILED photos"
          [ "${{ steps.sync-deceased.outcome }}" = "failure" ] && FAILED="$FAILED deceased"
          if [ -n "$FAILED" ]; then
            echo "::error::Failed sub-syncs:$FAILED"
            echo "FAILED_SUB_SYNCS=$FAILED" >> $GITHUB_ENV
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Sync Politicians Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed sub-syncs**: ${FAILED_SUB_SYNCS:-none}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [sync-politicians]
    if: failure() && !cancelled()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-politicians-failure";
            const title = `Sync Politicians failed - ${new Date().toISOString().split("T")[0]}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## Sync Politicians failed",
              "",
              `**Workflow run**: ${runUrl}`,
              `**Triggered by**: ${context.actor}`,
              `**Commit**: \`${context.sha.slice(0, 7)}\``,
              "",
              "Individual sub-syncs run independently. Open the workflow run to see which ones failed (the `Fail job if any sub-sync failed` step lists them).",
              "",
              "### Checklist",
              "- [ ] Open the workflow run and identify which sub-syncs failed",
              "- [ ] Check `docs/RUNBOOK.md` for triage steps",
              "- [ ] Re-run the workflow once the underlying cause is fixed",
              "- [ ] Close this issue when resolved",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, "automated"],
              });
            }
