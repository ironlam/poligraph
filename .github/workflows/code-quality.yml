name: Code Quality Guards

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: No $executeRawUnsafe without justification
        run: |
          # Find $executeRawUnsafe calls that don't have an eslint-disable or Safe: comment on the preceding line
          VIOLATIONS=$(grep -rn '\$executeRawUnsafe' src/ --include='*.ts' --include='*.tsx' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found \$executeRawUnsafe usage. Use \$executeRaw with Prisma.sql template literals instead."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No direct PUBLISHED writes outside an authorized publisher
        run: |
          # RGPD art. 10 : la publication d'une affaire passe exclusivement par
          # src/lib/affairs/publish-guard.ts. Ce step détecte les écritures
          # directes : un littéral `publicationStatus: "PUBLISHED"` dont le
          # contexte amont (12 lignes) contient `data:` plus près que `where:`.
          # scripts/ est couvert au même titre que src/.
          #
          # La détection est lexicale, donc aveugle au modèle : `PublicationStatus`
          # est un enum partagé, et ce step attrape aussi la publication d'une
          # mesure. La liste ci-dessous nomme donc UN fichier autorisé par modèle,
          # jamais un répertoire : tout autre fichier qui publierait une mesure
          # reste détecté, ce qui est bien l'invariant voulu.
          FOUND=0
          for f in $(grep -rl 'publicationStatus: "PUBLISHED"' src/ scripts/ --include='*.ts' --include='*.tsx' \
            | grep -v 'src/lib/affairs/publish-guard.ts' \
            | grep -v 'src/lib/measures/transitions.ts' \
            | grep -v '__tests__' | grep -v '\.test\.'); do
            while IFS=: read -r linenum rest; do
              START=$((linenum > 12 ? linenum - 12 : 1))
              CONTEXT=$(sed -n "${START},${linenum}p" "$f")
              DATA_LINE=$(echo "$CONTEXT" | grep -n 'data:' | tail -1 | cut -d: -f1)
              WHERE_LINE=$(echo "$CONTEXT" | grep -n 'where\|Where' | tail -1 | cut -d: -f1)
              if [ -n "$DATA_LINE" ] && { [ -z "$WHERE_LINE" ] || [ "$DATA_LINE" -gt "$WHERE_LINE" ]; }; then
                echo "::error file=$f,line=$linenum::Écriture directe de publicationStatus PUBLISHED hors publish-guard"
                FOUND=1
              fi
            done < <(grep -n 'publicationStatus: "PUBLISHED"' "$f")
          done
          exit $FOUND

      - name: Importers create affairs only through create-draft
        run: |
          # Le step précédent ne couvre qu'un littéral ; celui-ci pose
          # l'invariant structurel, qui tient quelle que soit l'expression
          # employée : un importeur (scripts/ ou src/services/sync/) ne
          # construit pas une affaire lui-même, il passe par
          # createDraftAffairFromDiscovery, qui force DRAFT.
          # seed-fixtures est exclu : fixtures de dev, protégé par
          # SEED_BLOCKED_HOSTS, et il ne touche pas publicationStatus.
          VIOLATIONS=$(grep -rn '\(db\|tx\)\.affair\.create' scripts/ src/services/sync/ --include='*.ts' \
            | grep -v '__tests__' | grep -v '\.test\.' \
            | grep -v 'scripts/seed-fixtures.ts' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Un importeur crée une affaire directement. Utilisez createDraftAffairFromDiscovery (src/services/affairs/create-draft.ts)."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Importers never write verifiedAt
        run: |
          # `verifiedAt` atteste d'une validation humaine : seul publish-guard
          # l'écrit, et toujours avec `verifiedBy`, atomiquement. Un des deux
          # champs sans l'autre ne veut rien dire.
          # On ne cible que l'affectation d'une date : `verifiedAt: true`
          # (select) et `verifiedAt: { not: null }` (where) restent permis.
          VIOLATIONS=$(grep -rn 'verifiedAt:.*new Date(' scripts/ src/services/sync/ --include='*.ts' \
            | grep -v '__tests__' | grep -v '\.test\.' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Un importeur écrit verifiedAt. La validation humaine passe exclusivement par assertPublishable()."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No press paywall circumvention
        run: |
          # L'ingestion presse se fait en accès anonyme, sur les sources en
          # accès libre. Aucun identifiant ni endpoint d'authentification
          # éditeur ne doit apparaître dans le code.
          # Les tests sont exclus : ils vérifient justement l'absence de ces
          # motifs, et les citer est leur seule façon de le faire.
          VIOLATIONS=$(grep -rniE 'MEDIAPART_(EMAIL|PASSWORD)|login_check' src/ scripts/ --include='*.ts' --include='*.tsx' \
            | grep -v '__tests__' | grep -v '\.test\.' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Référence à une authentification éditeur dans le code d'ingestion."
            echo "$VIOLATIONS"
            exit 1
          fi
          # Le robot s'identifie. La forme attendue nomme le projet et donne
          # une URL de contact :
          # "Mozilla/5.0 (compatible; Poligraph/1.0; +https://poligraph.fr)".
          UA=$(grep -rn 'Mozilla/5.0' src/ scripts/ --include='*.ts' --include='*.tsx' \
            | grep -v '__tests__' | grep -v '\.test\.' \
            | grep -v 'Poligraph' || true)
          if [ -n "$UA" ]; then
            echo "::error::User-Agent n'identifiant pas Poligraph. Le robot doit s'identifier avec une URL de contact."
            echo "$UA"
            exit 1
          fi

      - name: No dangerouslySetInnerHTML without sanitization
        run: |
          VIOLATIONS=$(grep -rn 'dangerouslySetInnerHTML' src/ --include='*.tsx' | grep -v 'DOMPurify\|sanitize\|JSON.stringify\|JsonLd\|markdown' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found dangerouslySetInnerHTML without sanitization."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No JSON.parse of user input without try-catch
        run: |
          # Flag JSON.parse(searchParams/param/body) in public API routes without try-catch
          # Excludes: admin routes (behind withAdminAuth), JSON.parse(JSON.stringify(...)) (deep clone)
          FOUND=0
          for f in $(grep -rl 'JSON\.parse' src/app/api/ --include='*.ts' | grep -v '/admin/'); do
            grep -n 'JSON\.parse' "$f" | grep -v 'JSON\.stringify' | while IFS=: read -r linenum rest; do
              START=$((linenum > 5 ? linenum - 5 : 1))
              CONTEXT=$(sed -n "${START},${linenum}p" "$f")
              echo "$CONTEXT" | grep -q 'try' && continue
              echo "::error file=$f,line=$linenum::JSON.parse of user input without try-catch"
              FOUND=1
            done
          done
          exit $FOUND

      - name: No findMany without where clause (full table scan)
        run: |
          # Flag findMany() with no where/take/select within 10 lines (unfiltered full table scan)
          VIOLATIONS=$(grep -rn '\.findMany(' src/lib/data/ src/lib/feature-flags.ts --include='*.ts' \
            | while IFS= read -r line; do
                FILE=$(echo "$line" | cut -d: -f1)
                LINENUM=$(echo "$line" | cut -d: -f2)
                END=$((LINENUM + 10))
                BLOCK=$(sed -n "${LINENUM},${END}p" "$FILE")
                echo "$BLOCK" | grep -q 'where[:, ]\|take:\|select:' && continue
                echo "$line"
              done || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::findMany() without 'where:' or 'take:' is a full table scan. Add a filter or limit."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No secrets in NEXT_PUBLIC_ vars
        run: |
          VIOLATIONS=$(grep -rn 'NEXT_PUBLIC_.*SECRET\|NEXT_PUBLIC_.*TOKEN\|NEXT_PUBLIC_.*PASSWORD\|NEXT_PUBLIC_.*API_KEY' src/ .env.example --include='*.ts' --include='*.tsx' --include='*.env*' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Potential secret exposed in NEXT_PUBLIC_ variable."
            echo "$VIOLATIONS"
            exit 1
          fi

  react-patterns:
    name: React Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: No forwardRef (deprecated in React 19)
        run: |
          VIOLATIONS=$(grep -rn 'React\.forwardRef\|forwardRef<' src/ --include='*.ts' --include='*.tsx' | grep -v 'node_modules\|generated/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::forwardRef is deprecated in React 19. Accept ref as a regular prop instead."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No hardcoded text-blue-600 in className (use text-primary)
        run: |
          # Exclude: config/ (color constants), .test. files, home/ (themed cards with intentional multi-color)
          VIOLATIONS=$(grep -rn 'text-blue-600' src/ --include='*.tsx' | grep -v 'config/\|\.test\.\|home/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Use text-primary instead of hardcoded text-blue-600."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No inline parseInt for pagination
        run: |
          VIOLATIONS=$(grep -rn 'parseInt(searchParams\.get\|parseInt(url\.searchParams' src/app/api/ --include='*.ts' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Use parsePagination() from @/lib/api/pagination instead of inline parseInt."
            echo "$VIOLATIONS"
            exit 1
          fi

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Admin routes use withAdminAuth
        run: |
          # Check all admin route files (except auth endpoint) export using withAdminAuth
          VIOLATIONS=""
          for f in $(find src/app/api/admin -name 'route.ts' | grep -v '/auth/'); do
            if ! grep -q 'withAdminAuth' "$f"; then
              VIOLATIONS="$VIOLATIONS\n$f: missing withAdminAuth wrapper"
            fi
          done
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Admin routes must use withAdminAuth() wrapper."
            echo -e "$VIOLATIONS"
            exit 1
          fi

      - name: No unjustified any without eslint-disable
        run: |
          # Match TypeScript any annotations (: any, as any) but not English "any" in comments
          VIOLATIONS=$(grep -rn ': any\b\|as any\b' src/ --include='*.ts' --include='*.tsx' \
            | grep -v 'generated/\|node_modules\|eslint-disable\|\.test\.\|\.d\.ts' \
            | grep -v '^\s*//' \
            | grep -v '// .*\bany\b' \
            | while IFS= read -r line; do
                FILE=$(echo "$line" | cut -d: -f1)
                LINENUM=$(echo "$line" | cut -d: -f2)
                PREV=$((LINENUM - 1))
                # Check if the any is in code (not in a comment on that line)
                CODE=$(echo "$line" | cut -d: -f3-)
                if echo "$CODE" | grep -qE ':\s*any\b|as\s+any\b'; then
                  # Verify it's not just "any" in a comment part of the line
                  CODE_BEFORE_COMMENT=$(echo "$CODE" | sed 's|//.*||')
                  if echo "$CODE_BEFORE_COMMENT" | grep -qE ':\s*any\b|as\s+any\b'; then
                    if ! sed -n "${PREV}p" "$FILE" | grep -q 'eslint-disable'; then
                      echo "$line"
                    fi
                  fi
                fi
              done || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found 'any' without eslint-disable comment. Add // eslint-disable-next-line @typescript-eslint/no-explicit-any or use proper types."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Factcheck queries use FACTCHECK_ALLOWED_SOURCES
        run: |
          # Check that factcheck findMany queries include the source filter
          VIOLATIONS=$(grep -rn 'factCheck\.findMany\|factCheck\.count' src/ --include='*.ts' --include='*.tsx' \
            | grep -v 'FACTCHECK_ALLOWED_SOURCES\|generated/\|admin/\|sync/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::factCheck query may be missing FACTCHECK_ALLOWED_SOURCES filter."
            echo "$VIOLATIONS"
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [security, react-patterns, architecture]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Code Quality Guards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| React Patterns | ${{ needs.react-patterns.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ needs.architecture.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
