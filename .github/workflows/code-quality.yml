name: Code Quality Guards

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify critical guard fixtures
        run: python3 -m unittest discover -s scripts/ci/__tests__ -p 'test_*.py' -v

      - name: No $executeRawUnsafe without justification
        run: python3 scripts/ci/code_quality_guards.py execute-raw-unsafe

      - name: No direct PUBLISHED writes outside an authorized publisher
        run: python3 scripts/ci/direct_publication_guard.py

      - name: Importers create affairs only through create-draft
        run: python3 scripts/ci/code_quality_guards.py importer-affair-create

      - name: Importers never write verifiedAt
        run: python3 scripts/ci/code_quality_guards.py importer-verified-at

      - name: No press paywall circumvention
        run: python3 scripts/ci/code_quality_guards.py press-paywall

      - name: No dangerouslySetInnerHTML outside canonical safe JSON-LD
        run: python3 scripts/ci/code_quality_guards.py dangerous-html

      - name: Public API JSON parsing uses safeJsonParse
        run: python3 scripts/ci/code_quality_guards.py json-parse

      - name: No findMany without where clause (full table scan)
        run: |
          # Performance heuristic, not a CI-01 critical security/editorial guard.
          VIOLATIONS=$(grep -rn '\.findMany(' src/lib/data/ src/lib/feature-flags.ts --include='*.ts' \
            | while IFS= read -r line; do
                FILE=$(echo "$line" | cut -d: -f1)
                LINENUM=$(echo "$line" | cut -d: -f2)
                END=$((LINENUM + 10))
                BLOCK=$(sed -n "${LINENUM},${END}p" "$FILE")
                echo "$BLOCK" | grep -q 'where[:, ]\|take:\|select:' && continue
                echo "$line"
              done || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::findMany() without 'where:' or 'take:' is a full table scan. Add a filter or limit."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: Commons thumbnail URLs built only via lib/photos/commons
        run: |
          # Availability/correctness guard, not a CI-01 security/editorial boundary.
          VIOLATIONS=$(grep -rn 'wikipedia/commons/thumb' src/ scripts/ --include='*.ts' --include='*.tsx' \
            | grep -v 'src/lib/photos/commons.ts' \
            | grep -v '__tests__' | grep -v '\.test\.' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Build Commons thumbnail URLs with commonsThumbnailUrl() from @/lib/photos/commons — hardcoded widths get rejected by Wikimedia."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No secrets in NEXT_PUBLIC_ vars
        run: python3 scripts/ci/code_quality_guards.py next-public-secrets

  react-patterns:
    name: React Patterns
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: No forwardRef (deprecated in React 19)
        run: |
          VIOLATIONS=$(grep -rn 'React\.forwardRef\|forwardRef<' src/ --include='*.ts' --include='*.tsx' | grep -v 'node_modules\|generated/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::forwardRef is deprecated in React 19. Accept ref as a regular prop instead."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No hardcoded text-blue-600 in className (use text-primary)
        run: |
          # Exclude: config/ (color constants), .test. files, home/ (themed cards with intentional multi-color)
          VIOLATIONS=$(grep -rn 'text-blue-600' src/ --include='*.tsx' | grep -v 'config/\|\.test\.\|home/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Use text-primary instead of hardcoded text-blue-600."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: No inline parseInt for pagination
        run: |
          VIOLATIONS=$(grep -rn 'parseInt(searchParams\.get\|parseInt(url\.searchParams' src/app/api/ --include='*.ts' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Use parsePagination() from @/lib/api/pagination instead of inline parseInt."
            echo "$VIOLATIONS"
            exit 1
          fi

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Admin routes use withAdminAuth
        run: python3 scripts/ci/code_quality_guards.py admin-auth

      - name: No unjustified any without eslint-disable
        run: |
          # Match TypeScript any annotations (: any, as any) but not English "any" in comments
          VIOLATIONS=$(grep -rn ': any\b\|as any\b' src/ --include='*.ts' --include='*.tsx' \
            | grep -v 'generated/\|node_modules\|eslint-disable\|\.test\.\|\.d\.ts' \
            | grep -v '^\s*//' \
            | grep -v '// .*\bany\b' \
            | while IFS= read -r line; do
                FILE=$(echo "$line" | cut -d: -f1)
                LINENUM=$(echo "$line" | cut -d: -f2)
                PREV=$((LINENUM - 1))
                CODE=$(echo "$line" | cut -d: -f3-)
                if echo "$CODE" | grep -qE ':\s*any\b|as\s+any\b'; then
                  CODE_BEFORE_COMMENT=$(echo "$CODE" | sed 's|//.*||')
                  if echo "$CODE_BEFORE_COMMENT" | grep -qE ':\s*any\b|as\s+any\b'; then
                    if ! sed -n "${PREV}p" "$FILE" | grep -q 'eslint-disable'; then
                      echo "$line"
                    fi
                  fi
                fi
              done || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Found 'any' without eslint-disable comment. Add // eslint-disable-next-line @typescript-eslint/no-explicit-any or use proper types."
            echo "$VIOLATIONS"
            exit 1
          fi

      - name: "Advisory: factcheck queries may need FACTCHECK_ALLOWED_SOURCES"
        run: |
          # Non-blocking heuristic only. It is deliberately excluded from the
          # CI-01 critical-guard set because it does not enforce a boundary: the
          # actual public fact-check source filter is versioned in data-access
          # code and covered by application tests. This step remains a review hint.
          VIOLATIONS=$(grep -rn 'factCheck\.findMany\|factCheck\.count' src/ --include='*.ts' --include='*.tsx' \
            | grep -v 'FACTCHECK_ALLOWED_SOURCES\|generated/\|admin/\|sync/' || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::warning::factCheck query may be missing FACTCHECK_ALLOWED_SOURCES filter."
            echo "$VIOLATIONS"
          fi

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [security, react-patterns, architecture]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## Code Quality Guards" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| React Patterns | ${{ needs.react-patterns.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | ${{ needs.architecture.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
