name: Storybook

# Publishes the living design documentation so designers can browse it without cloning the
# repository. Pull requests build it (and check the tokens export) but do not deploy.
# One-time setup: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".storybook/**"
      - "docs/design/**"
      - "scripts/export-design-tokens.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storybook.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - ".storybook/**"
      - "docs/design/**"
      - "scripts/export-design-tokens.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storybook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tokens:
    name: Design tokens export is current
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check docs/design/tokens.generated.json against globals.css
        run: npm run design:tokens:check

  build:
    name: Build Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Storybook
        run: npm run storybook:build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

      - name: Upload build for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [tokens, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
