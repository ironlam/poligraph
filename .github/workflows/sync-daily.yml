name: Daily Sync

on:
  schedule:
    # 3x per day (Paris time = UTC+1 in winter, UTC+2 in summer)
    - cron: "0 5 * * *" # ~6h Paris (winter) / ~7h (summer)
    - cron: "0 11 * * *" # ~12h Paris
    - cron: "0 19 * * *" # ~20h Paris (winter) / ~21h (summer)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# A run that starts late can meet the next one: queue it instead of letting two
# runs write the same rows.
concurrency:
  group: sync-daily
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  CRON_SECRET: ${{ secrets.CRON_SECRET }}
  NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL || 'https://poligraph.fr' }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  GOOGLE_FACTCHECK_API_KEY: ${{ secrets.GOOGLE_FACTCHECK_API_KEY }}
  VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
  JUDILIBRE_BASE_URL: ${{ secrets.JUDILIBRE_BASE_URL }}
  JUDILIBRE_OAUTH_URL: ${{ secrets.JUDILIBRE_OAUTH_URL }}
  JUDILIBRE_CLIENT_ID: ${{ secrets.JUDILIBRE_CLIENT_ID }}
  JUDILIBRE_CLIENT_SECRET: ${{ secrets.JUDILIBRE_CLIENT_SECRET }}
  JUDILIBRE_API_KEY: ${{ secrets.JUDILIBRE_API_KEY }}
  # Press backlog notifier (scripts/notify-press-backlog.ts)
  MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
  MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
  MAILJET_SENDER_EMAIL: ${{ secrets.MAILJET_SENDER_EMAIL }}
  MAILJET_SENDER_NAME: ${{ secrets.MAILJET_SENDER_NAME }}
  PRESS_BACKLOG_NOTIFY_EMAIL: ${{ secrets.PRESS_BACKLOG_NOTIFY_EMAIL }}
  DB_READ_TELEMETRY: ${{ vars.DB_READ_TELEMETRY || 'false' }}
  DB_READ_SAMPLE_RATE: ${{ vars.DB_READ_SAMPLE_RATE || '1' }}
  DB_READ_MAX_EVENTS: ${{ vars.DB_READ_MAX_EVENTS || '60' }}
  DB_READ_WINDOW_MS: ${{ vars.DB_READ_WINDOW_MS || '60000' }}
  DB_READ_ENVIRONMENT: production
  DB_READ_CONTEXT: ${{ github.event_name == 'schedule' && 'scheduled' || 'script' }}

jobs:
  votes:
    name: Votes (Assemblée, Sénat)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (votes)
        run: npm run sync:daily -- --group=votes

  legislation:
    name: Législation et résumés
    # After the votes: the scrutin summaries cover what the votes job just imported.
    # Runs even when that job failed.
    needs: [votes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (legislation)
        run: npm run sync:daily -- --group=legislation

  press-import:
    name: Presse (import RSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (press-import)
        run: npm run sync:daily -- --group=press-import

  press-analysis:
    name: Presse (analyse, réconciliation)
    # After the import, never alongside it. Runs even when the import failed: the
    # analysis works through the backlog.
    needs: [press-import]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (press-analysis)
        run: npm run sync:daily -- --group=press-analysis

  factchecks:
    name: Fact-checks, thèmes, embeddings
    needs: [legislation, press-import]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (factchecks)
        run: npm run sync:daily -- --group=factchecks

  scores:
    name: Scores, statuts, statistiques
    # Reads what every job above wrote. Runs whatever their outcome.
    needs: [votes, legislation, press-analysis, factchecks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (scores)
        run: npm run sync:daily -- --group=scores

  purge:
    name: Purge du cache
    # Last, and even after a failure or a cancellation: a job that failed halfway
    # still wrote rows the site should show.
    needs: [votes, legislation, press-import, press-analysis, factchecks, scores]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup
        uses: ./.github/actions/setup-sync

      - name: Run daily sync (purge)
        run: npm run sync:daily -- --group=purge

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [votes, legislation, press-import, press-analysis, factchecks, scores, purge]
    if: failure() && !cancelled()

    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const label = "sync-daily-failure";
            const title = `Daily sync failed - ${new Date().toISOString().split("T")[0]}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## Daily sync failed",
              "",
              `**Workflow run**: ${runUrl}`,
              `**Triggered by**: ${context.actor}`,
              `**Commit**: \`${context.sha.slice(0, 7)}\``,
              "",
              "### Checklist",
              "- [ ] Open the workflow run and identify the failing job and step",
              "- [ ] Check `docs/RUNBOOK.md` for triage steps",
              "- [ ] Re-run the workflow once the underlying cause is fixed",
              "- [ ] Close this issue when resolved",
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
            });

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label, "automated"],
              });
            }
