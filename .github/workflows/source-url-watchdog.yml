name: Source URL Watchdog

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  GOOGLE_FACTCHECK_API_KEY: ${{ secrets.GOOGLE_FACTCHECK_API_KEY }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit external source URLs
        id: source-audit
        continue-on-error: true
        run: |
          set -o pipefail
          npm run audit:source-urls 2>&1 | tee source-url-watchdog.txt
      - name: Open or update drift issue
        if: steps.source-audit.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: source-url-watchdog.txt
        with:
          script: |
            const fs = require("fs");
            const report = fs.readFileSync(process.env.REPORT_PATH, "utf8");
            const label = "source-url-drift";
            const title = `Dérive d'une source externe détectée, ${new Date().toISOString().slice(0, 10)}`;
            const body = [
              "## Sources externes à vérifier",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Le watchdog a détecté une URL non-2xx, une redirection ou une réponse anormalement petite.",
              "Les lignes FAIL indiquent l'URL et le service concerné.",
              "",
              "```text",
              report,
              "```",
              "",
              "Corriger ou remplacer la source, puis fermer cette issue.",
            ].join("\n");

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: label,
                color: "d73a4a",
                description: "Source externe utilisée par un sync indisponible ou modifiée",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [label],
              });
            }
      - name: Fail when source drift is present
        if: steps.source-audit.outcome == 'failure'
        run: exit 1
